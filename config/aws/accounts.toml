# AWS SSO accounts + roles for the `gammatech` access portal.
# Source: AWS access portal (https://gammatech.awsapps.com/start).
# Purpose: data file to generate ~/.aws/config SSO profiles.
#
# `key`/`aliases`/`role_aliases` are derived from the existing ~/.aws/config so a
# generator reproduces the current short profile names (e.g. `prod:admin`). Adjust freely.

[sso]
session = "gamma"
start_url = "https://gammatech.awsapps.com/start"
region = "us-east-2"
registration_scopes = "sso:account:access"

[defaults]
region = "us-east-2"
output = "json"

# Full SSO role name -> short profile suffix. Both prefixed (AWS*) and unprefixed
# variants map to the same suffix; accounts only get suffixes for roles they list.
[role_aliases]
AdministratorAccess = "admin"
AWSAdministratorAccess = "admin"
AWSPowerUserAccess = "poweruser"
ReadOnlyAccess = "readonly"
AWSReadOnlyAccess = "readonly"
Engineer = "eng"
BackendEngineer = "backend"
SitesEngineer = "sites"
DaytonaEngineer = "daytona"

[[accounts]]
key = "audit"
name = "Audit"
id = "363225048054"
email = "aws-audit@gamma.app"
roles = ["ReadOnlyAccess"]

[[accounts]]
key = "daytona-staging"
aliases = ["staging:daytona"]
name = "Daytona Staging"
id = "439328746527"
email = "aws+daytona.staging@gamma.app"
roles = ["AWSAdministratorAccess", "AWSPowerUserAccess", "AWSReadOnlyAccess", "DaytonaEngineer"]

