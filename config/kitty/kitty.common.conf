#
# kitty +runpy 'from kitty.config import *; print(commented_out_default_config())' > kitty.default.conf
#

env read_from_shell=PATH LANG LC_* XDG_* EDITOR VISUAL
editor .
shell_integration enabled
allow_remote_control socket-only
# listen_on unix:kitty.sock
listen_on unix:/tmp/kitty-{kitty_pid}
# Temporarily disabled: kitty-activity performance investigation.
# watcher tab_activity.py
watcher codex-user-vars.py
# watcher watcher.py
watcher window_size_guard.py

font_family Victor Mono
font_size 12
background_opacity 1.0
# text_composition_strategy legacy
# modify_font cell_width -1px
disable_ligatures cursor
cursor_shape block
cursor_shape_unfocused hollow
cursor_underline_thickness 1
cursor_trail 0
cursor_trail_start_threshold 50
cursor_trail_decay 0.1 0.4
cursor_trail_color #5B6268

dim_opacity 0.3
dynamic_background_opacity yes
hide_window_decorations titlebar-only
inactive_text_alpha 0.68
single_window_margin_width -1
single_window_padding_width -1
window_border_width 0.5pt
window_margin_width 0
window_padding_width 0
window_resize_step_cells 2
window_resize_step_lines 2
scrollbar scrolled
scrollback_lines 8096
scrollback_pager_history_size 4096
momentum_scroll 0.96

enable_audio_bell    no
visual_bell_duration 0.1
visual_bell_color    #44495a
bell_on_tab          "󰵙 "
notify_on_cmd_finish invisible 15

menu_map    global  "Actions::Pop keyboard mode"  pop_keyboard_mode
menu_map    global  "Actions::Command palette"    command_palette
menu_map    global  "Actions::Kitty shell"        kitty_shell

allow_hyperlinks       yes
show_hyperlink_targets yes
detect_urls            yes
open_url_with          default
url_prefixes           http https file ftp gemini irc gopher mailto news git at postgres clickhouse mysql exec kitty
url_style              curly

paste_actions         quote-urls-at-prompt,confirm,confirm-if-large
strip_trailing_spaces smart

# Tab behavior shared by both appearances (see kitty.tabs.*.conf).
tab_activity_symbol "󰅽 "
tab_switch_strategy previous
tab_bar_filter session:~ or session:^$
tab_bar_min_tabs 1

# Window title bars (in-terminal, per-window)
window_title_bar top
window_title_bar_min_windows 2
window_title_bar_align left
window_title_bar_active_foreground   #21222c
window_title_bar_active_background   #6272a4
window_title_bar_inactive_foreground #a0a4b8
window_title_bar_inactive_background #343746
window_title_template                " {fmt.bold}{fmt.fg.color1}{bell_symbol}{fmt.fg.color2}{progress_percent}{fmt.fg.window}{title} {fmt.fg.color3}{activity_symbol} "

enabled_layouts splits,stack,tall:bias=66,fat:bias=66,grid,horizontal,vertical

kitten_alias hints                  hints --hints-offset=0 --alphabet=abcdefghijklmnopqrstuvwxyz
action_alias broadcast              launch --allow-remote-control kitty +kitten broadcast --hide-input-toggle=ctrl+alt+esc --end-session=ctrl+esc
action_alias file_hints             kitten hints --customize-processing file_hints.py
action_alias launch_tab             launch --add-to-session=. --cwd=oldest --location=after  --type=tab
action_alias launch_window          launch --add-to-session=. --cwd=oldest --location=split  --type=window
action_alias launch_vsplit          launch --add-to-session=. --cwd=oldest --location=vsplit --type=window
action_alias launch_hsplit          launch --add-to-session=. --cwd=oldest --location=hsplit --type=window
action_alias launch_overlay_main    launch --add-to-session=. --cwd=oldest --location=after  --type=overlay-main --copy-env --env KITTY_OVERLAY_MAIN=1 --color=~/.config/kitty/themes/gruvbox-dark-soft.conf
action_alias resize_window_narrower resize_window narrower 4
action_alias resize_window_shorter  resize_window shorter 2
action_alias resize_window_taller   resize_window taller 2
action_alias resize_window_wider    resize_window wider 4

####################################################################
# OS Specific
####################################################################

linux_display_server               auto

macos_colorspace                   srgb
# macos_custom_beam_cursor           yes
macos_hide_from_tasks              no
macos_menubar_title_max_length     0
macos_option_as_alt                no
macos_quit_when_last_window_closed yes
macos_show_window_title_in         all
macos_titlebar_color               background
macos_traditional_fullscreen       no
macos_window_resizable             yes

wayland_enable_ime                 yes
wayland_titlebar_color             system

####################################################################
# Keyboard shortcuts
####################################################################

clear_all_shortcuts yes

kitty_mod ctrl+shift

# unbind toggle_macos_secure_keyboard_entry
map opt+cmd+s no_op

# Mouse
mouse_map left             press                ungrabbed  discard_event
mouse_map left             release              ungrabbed  mouse_handle_click selection link prompt
mouse_map left             doublepress          ungrabbed  mouse_selection word
mouse_map left             press                ungrabbed  mouse_selection normal
mouse_map left             triplepress          ungrabbed  mouse_selection line
mouse_map shift+left       press                ungrabbed  mouse_selection normal
mouse_map shift+left       doublepress  grabbed,ungrabbed  mouse_selection line
mouse_map shift+left       triplepress  grabbed,ungrabbed  mouse_select_command_output
mouse_map ctrl+alt+left    press        grabbed,ungrabbed  mouse_selection rectangle
mouse_map ctrl+shift+left  press        grabbed            discard_event
mouse_map ctrl+shift+left  release      grabbed,ungrabbed  mouse_click_url
mouse_map ctrl+shift+left  triplepress  grabbed,ungrabbed  mouse_selection line_from_point

mouse_map middle           release              ungrabbed  paste_from_selection
mouse_map shift+middle     release      grabbed,ungrabbed  paste_selection

mouse_map right            press                ungrabbed  mouse_show_command_output
mouse_map shift+right      press        grabbed,ungrabbed  mouse_selection extend
mouse_map ctrl+right       press        grabbed,ungrabbed  copy_selection_or_last_command_output

include current-theme.conf

draw_minimal_borders no
active_border_color #6272a4
inactive_border_color #44475a

include kitty.tabs.custom.conf
include kitty.keymap.conf
include !kitty.keymap.local.conf
map kitty_mod+o>p          kitten '/Users/logan/.cache/plannotator-tui/kitty/6ff9cf552f513b00/bridge.py' open --binary '/Users/logan/.local/share/cargo/bin/plannotator-tui'
map kitty_mod+o>shift+p    kitten '/Users/logan/.cache/plannotator-tui/kitty/6ff9cf552f513b00/bridge.py' last --binary '/Users/logan/.local/share/cargo/bin/plannotator-tui'
map kitty_mod+a            kitten '/Users/logan/.cache/plannotator-tui/kitty/6ff9cf552f513b00/bridge.py' selection --binary '/Users/logan/.local/share/cargo/bin/plannotator-tui'
map kitty_mod+alt+a        kitten '/Users/logan/.cache/plannotator-tui/kitty/6ff9cf552f513b00/bridge.py' terminal --binary '/Users/logan/.local/share/cargo/bin/plannotator-tui'
