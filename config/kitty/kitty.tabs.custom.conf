# Existing bottom tab bar, also the startup default.
active_tab_background #bd93f9
active_tab_font_style bold
active_tab_foreground #21222c
inactive_tab_background #343746
inactive_tab_font_style none
inactive_tab_foreground #a0a4b8
tab_bar_align left
tab_bar_background none
tab_bar_edge bottom
tab_bar_margin_height 0.0 0.0
tab_bar_margin_width 1
tab_bar_style custom

# Reload the complete config, then apply the vertical appearance overlay.
# remote_control resolves these paths relative to Kitty's config directory.
map kitty_mod+f12 remote_control load-config kitty.conf kitty.tabs.vertical.conf
