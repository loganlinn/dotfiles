hostname *
askpass ssh
delegate ssh
share_connections no # breaks ssh agent forwarding
forward_remote_control no # requires share_connections

hostname nijusan nijusan.internal nijusan.royal-bee.ts.net
color_scheme kanagawabones
share_connections yes
forward_remote_control yes

hostname fire.walla
color_scheme Gruvbox Light Soft

hostname logmini logmini.royal-bee.ts.net
color_scheme kanagawabones
# copy --dest .zshenv.remote .zshenv.local
copy --dest .zshrc.local .zshrc.local
copy --dest .zprofile.local .zprofile.local
env LLINN_RUN_COMMAND_AT_STARTUP=_kitty_copy_env_var_
