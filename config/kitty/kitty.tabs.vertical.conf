# Load AFTER kitty.conf. Use Kitty's built-in appearance and default sidebar
# width, retaining the configured theme colors and shared tab behavior.
active_tab_font_style bold-italic
inactive_tab_font_style normal
tab_bar_align start
tab_bar_edge left
tab_bar_margin_height 0.0 0.0
tab_bar_margin_width 0
tab_bar_style fade

# The same shortcut restores the complete config and its custom bottom bar.
map kitty_mod+f12 remote_control load-config kitty.conf
