#:schema https://mise.jdx.dev/schema/mise.json

# Launch from a project: mise -E agent-pi exec -- pi
# The project's mise.toml and mise.agent-pi.toml layer over these global defaults.
min_version = "2026.10.8"
include = ["./config.agent.toml"]

[env]
AGENT_KIND = "pi"

[tasks."agent:hooks:install"]
description = "Register the local hook framework with pi (no active extensions by default)"
extends = "agent:hooks:manage"
depends = ["agent:hooks:prepare"]
run = 'pi install "$HOME/.dotfiles/config/agent-hooks/packages/pi-family"'

[tasks."agent:hooks:status"]
description = "Show pi packages, including the local dotfiles-agent-hooks framework"
extends = "agent:hooks:manage"
run = "pi list"

[tasks."agent:hooks:uninstall"]
description = "Remove only the local hook framework from pi settings"
extends = "agent:hooks:manage"
run = 'pi remove "$HOME/.dotfiles/config/agent-hooks/packages/pi-family"'

[tasks."agent:hooks:update"]
description = "Reconcile pi's local hook package registration; source edits load on reload"
extends = "agent:hooks:manage"
depends = ["agent:hooks:prepare"]
run = 'pi install "$HOME/.dotfiles/config/agent-hooks/packages/pi-family"'
