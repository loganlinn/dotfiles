#:schema https://mise.jdx.dev/schema/mise.json

# Launch from a project: mise -E agent-codex exec -- codex
# The project's mise.toml and mise.agent-codex.toml layer over these global defaults.
min_version = "2026.10.6"
include = ["./config.agent.toml"]

# Codex-specific overrides belong here.
[env]
AGENT_ATUIN_NAME = "codex"
AGENT_KIND = "codex"

[tasks."agent:hooks:install"]
description = "Install the shared hook plugin for Codex"
extends = "agent:hooks:manage"
depends = ["agent:hooks:prepare", "agent:hooks:validate-plugin"]
run = [
  'codex plugin marketplace add "$HOME/.dotfiles/config/agent-hooks"',
  'codex plugin add agent-hooks@dotfiles',
]

[tasks."agent:hooks:status"]
description = "Show the Codex hook plugin; use /hooks in Codex to inspect trust"
extends = "agent:hooks:manage"
run = 'codex plugin list --marketplace dotfiles'

[tasks."agent:hooks:uninstall"]
description = "Remove only the shared Codex hook plugin"
extends = "agent:hooks:manage"
run = 'codex plugin remove agent-hooks@dotfiles'

[tasks."agent:hooks:update"]
description = "Refresh the installed Codex hook bindings after editing the plugin"
extends = "agent:hooks:manage"
depends = ["agent:hooks:prepare", "agent:hooks:validate-plugin"]
run = 'codex plugin add agent-hooks@dotfiles'
