#:schema https://mise.jdx.dev/schema/mise.json

[settings]
experimental = true
github.credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'
idiomatic_version_file_enable_tools = ["node"]
trusted_config_paths = [
  "~/src/github.com/loganlinn",
  "~/src/github.com/gamma-app",
]
auto_env = true

[settings.write_targets]
tools = "{{ config_source | dirname }}/conf.d/tools.toml"

[secrets.fnox]

[hooks]
postinstall = "misecompsync --shell zsh --new-only"

[wrappers.python]
command = "uv"
args = ["run", "python"]
