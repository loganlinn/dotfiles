#:schema https://mise.jdx.dev/schema/mise.json

# Launch from a project: mise -E codex exec -- codex
# The project's mise.toml and mise.codex.toml layer over these global defaults.
min_version = "2026.10.6"
include = ["./config.agent.toml"]

# Codex-specific overrides belong here.
[env]
AGENT_KIND = "codex"
