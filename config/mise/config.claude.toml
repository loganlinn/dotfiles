#:schema https://mise.jdx.dev/schema/mise.json

# Launch from a project: mise -E claude exec -- claude
# The project's mise.toml and mise.claude.toml layer over these global defaults.
min_version = "2026.10.6"
include = ["./config.agent.toml"]

# Claude-specific overrides belong here.
[env]
AGENT_KIND = "claude"
