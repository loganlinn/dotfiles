#:schema https://mise.jdx.dev/schema/mise.json

[dotfiles."~/.config/direnv/lib"]
source = "~/.dotfiles/config/direnv/lib"
mode = "symlink-each"

[dotfiles."~/.config/fnox"]
source = "~/.dotfiles/config/fnox"
mode = "symlink-each"

[dotfiles."~/.config/ghostty/config"]
source = "~/.dotfiles/config/ghostty/config"
mode = "symlink"

[dotfiles."~/.config/ghostty/keybind.config"]
source = "~/.dotfiles/config/ghostty/keybind.config"
mode = "symlink"

[dotfiles."~/.config/ghostty/linux.config"]
source = "~/.dotfiles/config/ghostty/linux.config"
mode = "symlink"

[[dotfiles."~/.config/ghostty/linux.config".variants]]
os = "linux"

[dotfiles."~/.config/ghostty/macos.config"]
source = "~/.dotfiles/config/ghostty/macos.config"
mode = "symlink"

[[dotfiles."~/.config/ghostty/macos.config".variants]]
os = "macos"

[dotfiles."~/.config/herdr/config"]
source = "~/.dotfiles/config/herdr/config.toml"

[dotfiles."~/.config/k9s"]
source = "~/.dotfiles/config/k9s"
mode = "symlink-each"

[dotfiles."~/.config/mise"]
source = "~/.dotfiles/config/mise"
mode = "symlink-each"

[dotfiles."~/.local/share/zsh/functions"]
source = "~/.dotfiles/config/zsh/functions"
mode = "symlink-each"
