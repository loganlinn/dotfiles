# yaml-language-server: $schema=https://gh-dash.dev/schema.json
prSections:
  - title: Inbox
    filters: >
      is:open
      review-requested:@me 
      -author:@me
      -reviewed-by:@me 
      updated:>={{ nowModify "-2w" }}
  - title: Approved
    filters: >
      is:open
      author:@me
      review:approved
      -is:draft 
      updated:>={{ nowModify "-2w" }}
  - title: Rejected
    filters: >
      is:open
      author:@me
      review:changes-requested
      -is:draft 
      updated:>={{ nowModify "-2w" }}
  - title: Blocked
    filters: >
      is:open
      author:@me
      review:required
      -is:draft 
      updated:>={{ nowModify "-2w" }}
  - title: Merged
    filters: >
      author:@me
      is:merged
      updated:>={{ nowModify "-2w" }}
  - title: Closed
    filters: >
      author:@me
      is:closed
      updated:>={{ nowModify "-2w" }}
  - title: Drafts
    filters: >
      author:@me
      is:draft 
      updated:>={{ nowModify "-2w" }}
  - title: Created
    filters: >
      author:@me
      updated:>={{ nowModify "-2w" }}
  - title: Reviewed
    filters: >
      reviewed-by:@me 
      updated:>={{ nowModify "-2w" }}
  - title: "#needs-testing"
    filters: >
      is:merged
      label:needs-testing 
      updated:>={{ nowModify "-2w" }}
  - title: "#terraform"
    filters: >
      label:terraform 
      updated:>={{ nowModify "-2w" }}

issuesSections:
  - title: Assigned
    filters: is:open assignee:@me
  - title: Involved
    filters: is:open involves:@me -author:@me
  - title: Open
    filters: is:open
  - title: Closed
    filters: -is:open
defaults:
  preview:
    open: true
    width: 50
  prsLimit: 20
  issuesLimit: 20
  view: prs
  layout:
    prs:
      updatedAt:
        width: 7
      repo:
        width: 15
      author:
        width: 15
      assignees:
        width: 20
        hidden: true
      base:
        width: 15
        hidden: true
      lines:
        width: 16
    issues:
      updatedAt:
        width: 7
      repo:
        width: 15
      creator:
        width: 10
      assignees:
        width: 20
        hidden: true
  refetchIntervalMinutes: 30
keybindings:
  prs:
    - key: T
      command: gh enhance -R {{.RepoName}} {{.PrNumber}}
    - key: r
      name: open repository in Herdr
      command: |
        repo_name='{{.RepoName}}'
        owner=${repo_name%%/*}
        repo=${repo_name#*/}
        herdr_bin=$(mise which herdr) || exit 1
        workspaces=$("$herdr_bin" --session "$owner" workspace list) || exit 1
        workspace_id=$(
          printf '%s\n' "$workspaces" |
            jq -r --arg label "$repo" \
              'first(.result.workspaces[]? | select(.label == $label) | .workspace_id) // empty'
        ) || exit 1
        if [ -n "$workspace_id" ]; then
          "$herdr_bin" --session "$owner" tab create \
            --workspace "$workspace_id" \
            --cwd '{{.RepoPath}}' \
            --focus
        else
          "$herdr_bin" --session "$owner" workspace create \
            --cwd '{{.RepoPath}}' \
            --label "$repo" \
            --focus
        fi
    - key: O
      command: >
        kitty launch
repoPaths:
  # ":owner/:repo": "~/src/github.com/:owner/:repo"
  "gamma-app/*": "~/src/github.com/gamma-app/*"
  # "loganlinn/*": "~/src/github.com/loganlinn/*"
pager:
  diff: diffnav
