set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-features ",*:RGB:usstyle" # Truecolor & undercurl support

set -g history-limit 20000

set-option -g monitor-bell        on
set-option -g mouse               on
set-option -g set-titles          on
# set-option -g set-titles-string   '#h: [#S:#W] #T'
set -g set-titles-string "#S #I:#P #W:#T"
set-option -g status-position     bottom
set-option -g status-left         '[#S@#h]'
set-option -g status-left-length  20
set-option -g status-right        '"#38T"'
set-option -g status-right-length 40
set-option -g escape-time         5
set-option -g display-time        1000 # Message display time
set-option -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP DBUS_SESSION_BUS_ADDRESS WAYLAND_DISPLAY"
set -g detach-on-destroy off # Switch sessions instead of detaching

set -ga terminal-features ",xterm-kitty:RGB:usstyle"
set -as terminal-features ',xterm-kitty:clipboard'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underline color
set -as terminal-overrides ',xterm*:Tc'  # true color
set -s set-clipboard   on   #     OSC   52       clipboard
set -s extended-keys   on   #     xterm extended keys
set -g focus-events    on   #     pass  focus    events to apps (vim autoread)
set -g base-index      1    #     start window   number at 1
set -g pane-base-index 1  # start pane  number   at     1
set -g automatic-rename on # Automatically rename windows
set -g visual-activity on

setw -g monitor-activity on

# Mark Kitty clients for conditional mappings (var:in_tmux). MQ== is base64 for 1.
# Write to the client's terminal directly, bypassing tmux's pane escape filtering.
# This hook covers both new sessions and attaching to existing sessions.
set-hook -g client-session-changed[100] {
if-shell -F '#{==:#{client_termname},xterm-kitty}' {
set -g '@kitty-client-#{hook_client}' 1
run-shell 'printf "\033]1337;SetUserVar=in_tmux=MQ==\007" > #{q:client_tty}'
}
}
set-hook -g client-detached[100] {
# Detached clients only retain hook_client (their tty), not client_termname.
if-shell 'test "$(tmux show-option -gqv @kitty-client-#{q:hook_client})" = 1' {
run-shell 'printf "\033]1337;SetUserVar=in_tmux\007" > #{q:hook_client}'
set -gu '@kitty-client-#{hook_client}'
}
}

set-window-option -g mode-keys         vi
set-window-option -g status-keys       emacs
set-window-option -g wrap-search       off
set-window-option -g aggressive-resize on
set-window-option -g alternate-screen  off

set-option -g prefix    C-b
set-option -gu prefix2

unbind C-s
unbind C-q

bind C-b send-keys C-b
bind Z   suspend-client
bind `   select-window -t 0
bind C-c new-window
bind h   select-pane -L
bind C-h resize-pane -L 5
bind j   select-pane -D
bind C-j resize-pane -D 5
bind k   select-pane -U
bind C-k resize-pane -U 5
bind l   select-pane -R
bind C-l resize-pane -R 5
bind _   resize-pane -Z
bind H   join-pane -b -h -t !
bind J   join-pane -t !
bind @   join-pane -t !
bind K   kill-pane

bind R   source ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
bind y   run "tmux show-buffer | if [ -x /usr/bin/pbcopy ]; then pbcopy; else xclip -i; fi"
# bind -t vi-copy y copy-selection \; run "tmux show-buffer | if [ -x /usr/bin/pbcopy ]; then pbcopy; else xclip -i; fi"

bind -n S-Up copy-mode
bind -n S-Right next-window
bind -n S-Left previous-window
bind -n S-Down command-prompt
bind Tab select-pane -t :.+

# vi copy mode bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin '2kabhishek/tmux-tea'
set -g @plugin '2kabhishek/tmux-tilit'
# set -g @plugin 'samleeney/tmux-agent-status'

# Plugin options
set -g @extrakto_fzf_layout 'reverse'
set -g @extrakto_key 'f'
set -g @extrakto_insert_key 'enter'
set -g @extrakto_copy_key 'ctrl-y'
set -g @tea-default-command ""
set -g @tea-include-sessions "true"
set -g @tea-agent-patterns "claude|codex|pi|omp|devin"
set -g @tea-find-path "$PWD/.."
set -g @tilit-autotiling 'on'
set -g @tilit-config "$HOME/.config/tmux/tmux.conf"
set -g @tilit-navigator 'off'
set -g @tilit-prefix 'C-'
set -g @tilit-shiftnum '!@#$%^&*()' # US keyboard

if-shell 'test -f "$HOME/.config/tmux/tmux.conf.local"' 'source ~/.config/tmux/tmux.conf.local'

# TPM bootstrap (keep at bottom)
if-shell 'test ! -d ~/.config/tmux/plugins/tpm' 'run "git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm"'
run -b '~/.config/tmux/plugins/tpm/tpm'

# Ensure no plugin overrides Ctrl-H/J/K/L
# unbind -n C-h
# unbind -n C-j
# unbind -n C-k
# unbind -n C-l
