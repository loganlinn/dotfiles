[settings]
experimental = true
jobs = 4
auto_env = true     # https://mise.jdx.dev/configuration/settings.html#auto_env

[env]
_.path = ["{{config_root}}/bin"]

[dotfiles]
"~/.config/direnv/lib" = { source = "config/direnv/lib", mode = "symlink-each" }
"~/.config/herdr/config" = "config/herdr/config.toml"
"~/.config/k9s" = { source = "config/k9s", mode = "symlink-each" }
# Link global mise configs, agent overlays, shared hook tasks, and task templates.
# Keep config.agent.toml beside all four agent overlays for their includes.
"~/.config/mise" = { source = "config/mise", mode = "symlink-each" }
"~/.local/share/zsh/functions" = { source = "config/zsh/functions", mode = "symlink-each" }
"~/.config/ghostty/config" = {source = "config/ghostty/config", mode = "symlink"}
"~/.config/ghostty/keybind.config" = {source = "config/ghostty/keybind.config", mode = "symlink"}
"~/.config/ghostty/macos.config" = {source = "config/ghostty/macos.config", mode = "symlink", variants = [{ os = "macos" }]}
"~/.config/ghostty/linux.config" = {source = "config/ghostty/linux.config", mode = "symlink", variants = [{ os = "linux" }]}

[bootstrap]

[bootstrap.repos]

[bootstrap.repos."~/.dotfiles"]
url = "https://github.com/loganlinn/dotfiles"

[bootstrap.repos."~/src/github.com/loganlinn/agents"]
url = "https://github.com/loganlinn/agents"

[bootstrap.repos."~/src/github.com/loganlinn/gmx"]
url = "https://github.com/loganlinn/gmx"

[bootstrap.repos."~/.config/doom"]
url = "https://github.com/loganlinn/.doom.d.git"

[bootstrap.repos."~/.config/emacs"]
url = "https://github.com/doomemacs/core.git"

[tasks]

[tasks."agent:hooks:bootstrap"]
description = "Link mise configuration and install the hook framework for Claude, Codex, oh-my-pi, and pi"
run = [
  'mise dot apply --yes "$HOME/.config/mise"',
  'mise -E agent-claude run --skip-tools agent:hooks:install',
  'mise -E agent-codex run --skip-tools agent:hooks:install',
  'mise -E agent-omp run --skip-tools agent:hooks:install',
  'mise -E agent-pi run --skip-tools agent:hooks:install',
]

[tasks.clean]
depends = "*:clean"

[tasks.fmt]
depends = "*:fmt"
run = "mise fmt"

[tasks.lint]
depends = "*:lint"
run = "mise fmt --check"

[tasks.check]
depends = "*:check"
run = "mise check"

[tasks.test]
usage = '''
arg "[files]" var=#true help="Test files to run (default: all .bats files)"
'''
run = "mise --cd ./test run test ${usage_files}"

# ============================================================================
# Shell Tasks
# ============================================================================

[tasks."shell:lint"]
description = "Lint shell scripts with shellcheck"
tools = { shellcheck = "latest" }
run = '''
set -euo pipefail

# Discover shell scripts by shebang under script directories
scripts=()
while IFS= read -r -d '' f; do
  read -r shebang <"$f" 2>/dev/null || continue
  [[ $shebang =~ ^#!.*[[:space:]/](bash|sh|dash|ksh)([[:space:]]|$) ]] \
    && scripts+=("$f")
done < <(
  find bin darwin/bin linux/bin mise-tasks .mise/tasks \
    -type f \
    ! -name '*.zwc' ! -name '*.pyc' \
    ! -path '*/__pycache__/*' \
    -print0 2>/dev/null
)

if [[ ${#scripts[@]} -eq 0 ]]; then
  echo >&2 "No shell scripts found."
  exit 0
fi

shellcheck "${scripts[@]}"
'''

# ============================================================================
# Nix Tasks
# ============================================================================

[tasks."nix:fmt"]
run = "alejandra ."

[tasks."nix:clean"]
run = "fd -u -F result"

[tasks."nix:check"]
run = "nix flake check"

[tasks."nix:update"]
description = "Update flake inputs"
run = '''
nix flake update --commit-lock-file "$@"
'''

[tasks."nix:update:core"]
depends = [
  { task = "nix:update", args = [
    "nixpkgs",
    "home-manager",
    "nix-darwin",
    "nixos-hardware",
  ] },
]

[tasks."nix:repl"]
alias = "repl"
description = "Start flake repl"
usage = '''
arg "[file]" help="Repl file to load" default="./repl.nix"
'''
run = "nix repl --verbose --trace-verbose --file ${usage_file?}"

[tasks."nix:develop"]
description = "Enter nix development shell"
usage = '''
arg "[args]" var=#true help="Additional arguments"
'''
run = "nix develop --command zsh ${usage_args[@]}"

# ----------------------------------------------------------------------------
# nix-darwin
# ----------------------------------------------------------------------------

[tasks."darwin:configure"]
description = "Save this Mac's Darwin configuration in mise.local.toml"
usage = '''
arg "<configuration>" help="Name in darwinConfigurations (for example, logammini)"
'''
run = '"{{mise_bin}}" set --file "{{config_root}}/mise.local.toml" "NIX_DARWIN_FLAKE={{config_root}}#${usage_configuration?}"'

[tasks."darwin:switch"]
alias = "switch"
description = "Apply the selected Darwin configuration"
run = '''
set -eu
flake="${NIX_DARWIN_FLAKE:-{{config_root}}}"
configuration="${flake#*#}"
if [ "$configuration" = "$flake" ] || [ -z "$configuration" ]; then
  configuration="$(scutil --get LocalHostName)"
fi

# Run the rebuild tool from this configuration, including before first activation.
sudo "$(command -v nix)" run \
  "${flake%%#*}#darwinConfigurations.${configuration}.config.system.build.darwin-rebuild" \
  -- switch --flake "${flake%%#*}#${configuration}"
'''

# ----------------------------------------------------------------------------
# nixos
# ----------------------------------------------------------------------------

[tasks."nixos:bootstrap"]
depends = ["nixos:link", "nixos:switch"]

[tasks."nixos:link"]
run = '''
lns -f {{config_root}}/flake.nix /etc/nixos/flake.nix
lns -f {{config_root}}/flake.nix "${XDG_CONFIG_HOME:-$HOME/.config}/home-manager/flake.nix"
'''

[tasks."nixos:switch"]
run = '{{config_root}}/bin/cachix-run sudo -E nixos-rebuild switch --flake {{config_root}}'

[tasks."nix:gc"]
run = "nix-collect-garbage --delete-old"
